<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="robots" content="noindex,nofollow,noarchive"/>
  <title>استعادة كلمة المرور | سوقك SOOQAK</title>
  <style>
    :root{color-scheme:light;--navy:#122c4b;--gold:#c1943f;--border:#dce3ed}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f5f3ef;color:var(--navy);font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:22px}
    main{width:min(100%,470px);background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 14px 44px #122c4b17;overflow:hidden}
    header{background:var(--navy);color:#fff;padding:26px 24px;text-align:center}
    .brand{font-size:29px;font-weight:800;color:#edc875}.brand small{font-size:16px;color:#fff;letter-spacing:2px}
    .body{padding:25px}h1{font-size:23px;margin:0 0 14px}p{line-height:1.9}label{display:block;margin:15px 0 6px;font-weight:700}
    input{display:block;width:100%;height:48px;border:1px solid #bfc9d4;border-radius:12px;padding:0 13px;font-size:16px;background:#fff;color:#142b49}
    input[readonly]{background:#f3f6f9;color:#4b596c}input:focus{outline:2px solid var(--gold);outline-offset:2px}
    button,.link{display:block;width:100%;text-align:center;padding:14px;margin-top:20px;border:0;border-radius:12px;font:700 16px Tahoma,Arial,sans-serif;text-decoration:none}
    button{background:var(--gold);color:var(--navy);cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
    .link{background:#f2f5fa;color:var(--navy)}#recoveryStatus{background:#f4f6f9;border-radius:12px;padding:12px 14px;margin:12px 0}
    .note{font-size:13px;color:#5e6877;margin-top:16px} [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
<header><div class="brand">سوقك <small dir="ltr">| SOOQAK</small></div></header>
<div class="body">
<h1>تعيين كلمة مرور جديدة</h1>
<p id="recoveryStatus" role="status" aria-live="polite">نتحقق من رابط الاستعادة الآمن…</p>
<form id="recoveryForm" hidden autocomplete="off">
  <label for="recoveryEmail">البريد المرتبط بحسابك</label>
  <input id="recoveryEmail" type="email" readonly autocomplete="username" aria-readonly="true"/>
  <label for="newPassword">كلمة المرور الجديدة</label>
  <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="8 خانات على الأقل"/>
  <label for="confirmPassword">تأكيد كلمة المرور</label>
  <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="أعد كتابة كلمة المرور"/>
  <button id="resetSave" type="submit">حفظ كلمة المرور الجديدة</button>
</form>
<p id="recoverySuccess" hidden>تم تغيير كلمة المرور. سجّل الدخول إلى سوقك باستخدام بريدك وكلمة المرور الجديدة.</p>
<a class="link" id="recoveryLogin" href="./index.html?auth=login">العودة إلى تسجيل الدخول</a>
<p class="note">لا تشارك رابط الاستعادة أو كلمة المرور مع أحد. لا يُسمح بالتغيير إلا بعد التحقق من جلسة استعادة معتمدة.</p>
</div>
</main>
<script type="module" src="./reset-password.mjs"></script>
</body>
</html>
