name: SOOQAK - Zero Cost Quality Checks
on:
  push:
    branches: [develop/v38-recovery]
  pull_request:
    branches: [main, develop/v38-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-secret-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path './node_modules/*' -print0)
      - name: Zero-cost owner finance and evidence unit tests
        run: node --test tests/owner-finance.test.mjs tests/owner-economy.test.mjs tests/owner-provider-audit.test.mjs tests/owner-activity-health.test.mjs tests/owner-reports.test.mjs
      - name: Basic tracked-file secret guard
        shell: bash
        run: |
          python3 scripts/check-secrets.py
      - name: Backup helper syntax only (no database connection)
        shell: bash
        run: bash -n scripts/backup-snapshot.sh
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner (no app dependencies changed)
        run: npm install --no-save --no-package-lock @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local browser smoke tests
        run: npx playwright test --config=playwright.config.cjs
  backup-restore-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore synthetic data in a fresh socket-only PostgreSQL cluster
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=$(find /usr/lib/postgresql -name initdb -type f | sort -V | tail -1)
          test -x "$pg_bin"
          PATH="$(dirname "$pg_bin"):$PATH" bash scripts/test-backup-restore.sh
