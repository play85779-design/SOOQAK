name: G100 isolated browser acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'v101/**'
      - 'tests/v191-browser-acceptance.mjs'
      - 'tests/g100-auth-header-acceptance.mjs'
      - 'tests/g100-auth-submit-isolated.mjs'
      - 'tests/r100-account-shell.mjs'
      - '.github/workflows/g100-browser-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: g100-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  chromium:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/sooqak-g100-auth-qa-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate JavaScript syntax before browser tests
        run: |
          node --check v101/app.js
          node --check v101/connected-auth.js
          node --check v101/cloud-test.js
          node --check v101/shared-routes.js
          node --check tests/r100-account-shell.mjs
          node --check tests/g100-auth-header-acceptance.mjs
          node --check tests/v191-browser-acceptance.mjs
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: npx --no-install playwright install --with-deps chromium webkit
      - name: Focused authentication form regression (Chromium and WebKit)
        run: node tests/g100-auth-submit-isolated.mjs
      - name: R100 account shell and canonical navigation
        run: node tests/r100-account-shell.mjs
      - run: node tests/g100-auth-header-acceptance.mjs
      - run: node tests/v191-browser-acceptance.mjs
      - run: node tests/g100-auth-header-acceptance.mjs
        env:
          G100_BROWSER: webkit
