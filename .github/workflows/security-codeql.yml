name: SOOQAK - CodeQL Security
on:
  push:
    branches: [develop/v38-recovery]
  pull_request:
    branches: [main, develop/v38-recovery]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
      - name: Report CodeQL finding locations in draft preview (temporary)
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const p = path.resolve('../results/javascript.sarif');
          if (!fs.existsSync(p)) { console.log('CODEQL_DIAGNOSTIC: SARIF unavailable'); process.exit(0); }
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          for (const run of d.runs || []) {
            for (const item of (run.results || []).slice(0,50)) {
              const x = (item.locations || [])[0]?.physicalLocation;
              console.log('CODEQL_FINDING', JSON.stringify({
                rule: item.ruleId,
                severity: item.level,
                file: x?.artifactLocation?.uri,
                line: x?.region?.startLine
              }));
            }
          }
          NODE
